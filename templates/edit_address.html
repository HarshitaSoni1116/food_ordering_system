{% extends "base.html" %}

{% load static %}

{% block title %}
Edit Address | Foodie
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">
{% endblock %}

{% block content %}

<div class="address-edit-page">

    <div class="address-edit-card">

        <div class="address-edit-header">
            <h1>
                <i class="bi bi-pencil-square"></i>
                Edit Address
            </h1>

            <p>Update your saved delivery address</p>
        </div>

        <form
            method="POST"
            action="{% url 'edit_address' address.id %}"
        >

            {% csrf_token %}

            <div class="form-group">

                <label>Address Type</label>

                <select name="address_type" required>

                    <option
                        value="Home"
                        {% if address.address_type == "Home" %}selected{% endif %}
                    >
                        Home
                    </option>

                    <option
                        value="Work"
                        {% if address.address_type == "Work" %}selected{% endif %}
                    >
                        Work
                    </option>

                    <option
                        value="Other"
                        {% if address.address_type == "Other" %}selected{% endif %}
                    >
                        Other
                    </option>

                </select>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="full_name"
                        value="{{ address.full_name }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        name="phone"
                        value="{{ address.phone }}"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>Complete Address</label>

                <textarea
                    name="address"
                    rows="3"
                    required
                >{{ address.address }}</textarea>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>City</label>

                    <input
                        type="text"
                        name="city"
                        value="{{ address.city }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Pincode</label>

                    <input
                        type="text"
                        name="pincode"
                        value="{{ address.pincode }}"
                        maxlength="10"
                        required
                    >

                </div>

            </div>


            <label class="default-address">

                <input
                    type="checkbox"
                    name="is_default"
                    {% if address.is_default %}checked{% endif %}
                >

                <span>
                    Make this my default address
                </span>

            </label>


            <div class="edit-address-actions">

                <a
                    href="{% url 'profile' %}"
                    class="cancel-address-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="save-address-btn"
                >
                    <i class="bi bi-check-lg"></i>
                    Update Address
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
